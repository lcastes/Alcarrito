name: Actualizar precios

on:
  schedule:
    - cron: '0 5 * * *'   # cada día a las 05:00 UTC (07:00 en España en verano, 06:00 en invierno)
  workflow_dispatch:       # también puedes lanzarlo a mano desde la pestaña Actions

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        working-directory: scripts
        run: npm install --no-audit --no-fund
      - name: Actualizar precios
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          POSTAL_CODE: '20013'
        run: node actualizar-precios.mjs
