async function searchOFF(q){

  const mp=p=>({code:String(p.code||''),name:p.product_name||'',brand:br(p),qty:p.quantity||'',ns:/^[a-e]$/.test(p.nutriscore_grade||'')?p.nutriscore_grade:'',img:p.image_front_small_url||''});

    if(!r.ok)throw new Error('http');const d=await r.json();return (d.products||[]).map(mp).filter(x=>x.code)};
  try{let rs=await run(true);if(!rs.length)rs=await run(false);return rs}
  catch(e){const r=await fetch(`https://search.openfoodfacts.org/search?q=${encodeURIComponent(q)}&page_size=12&fields=${f}`);

}

function parseIng(line){
  let t=String(line).trim().replace(/^[-•*·]\s*/,'');if(!t||/:\s*$/.test(t))return null;let q=null,m;

  else if((m=t.match(/^(\d+)\s*\/\s*(\d+)\s*/))){q=(+m[1])/(+m[2]);t=t.slice(m[0].length)}
  else if((m=t.match(/^(\d+(?:[.,]\d+)?)\s*(?:-|–|a)\s*\d+(?:[.,]\d+)?\s*/))){q=parseFloat(m[1].replace(',','.'));t=t.slice(m[0].length)}
  else if((m=t.match(/^(\d+(?:[.,]\d+)?)\s*/))){q=parseFloat(m[1].replace(',','.'));t=t.slice(m[0].length)}
  else if((m=t.match(/^([½¼¾⅓⅔])\s*/))){q={'½':0.5,'¼':0.25,'¾':0.75,'⅓':1/3,'⅔':2/3}[m[1]];t=t.slice(m[0].length)}
  else if((m=t.match(/^(una?|un par de|medio|media)\s+/i))){q=/medi/i.test(m[1])?0.5:(/par/i.test(m[1])?2:1);t=t.slice(m[0].length)}
  let u='',f=1;m=t.match(/^([a-zA-ZáéíóúñÁÉÍÓÚ]+)\.?\s+/);
  if(m&&UN[m[1].toLowerCase()]){[u,f]=UN[m[1].toLowerCase()];t=t.slice(m[0].length)}
  t=t.replace(/^(de(l| la| los| las)?|d')\s+/i,'').split(',')[0].replace(/\s*\(.*?\)\s*/g,' ').replace(/\s+(al gusto|c\/s|opcional)$/i,'').trim();
  if(!t)return null;
  return {n:t,q:q==null?null:Math.round(q*f*1000)/1000,u,t:String(line).trim()};
}

const COSN={g:'Sin riesgo',y:'Riesgo bajo',o:'Riesgo moderado',r:'Riesgo alto',u:'Sin clasificar'};
function cosParse(t){
  t=String(t||'').replace(/\r/g,'\n').replace(/^\s*(ingredients?|ingr[eé]dients?|ingredientes|composici[oó]n|composition|inci)\s*[:\-]?\s*/i,'');
  const out=[];let dep=0,cur='';
  for(const ch of t){if(ch==='('||ch==='[')dep++;else if(ch===')'||ch===']')dep=Math.max(0,dep-1);
    if(dep===0&&(ch===','||ch===';'||ch==='\n'||ch==='·'||ch==='•')){if(cur.trim())out.push(cur.trim());cur=''}else cur+=ch}
  if(cur.trim())out.push(cur.trim());
  return out.map(x=>x.replace(/[*†]+/g,'').replace(/\.$/,'').trim()).filter(x=>x&&x.length>1&&x.length<80);
}
function cosClass(name){
  const raw=norm(name).replace(/\d+([.,]\d+)?\s*%/g,'').replace(/\s+/g,' ').trim();
  const base=raw.replace(/\(.*?\)/g,' ').replace(/\s+/g,' ').trim()||raw;
  // el nombre alternativo entre paréntesis ("Aqua (Water)", "Parfum (Fragrance)") también cuenta
  for(const f of COSR){if(f[0].test(base)||f[0].test(raw))return {k:f[1],why:f[2]}}
  return {k:'u',why:'Sin clasificar en la app: no hay una valoración de riesgo para este ingrediente.'}}
function cosAnalyze(text){
  const items=cosParse(text).map(n=>({n,...cosClass(n)}));

    e.o.forEach((o,i)=>L.push({p,sid,i,o,price:o.price||0,g:o.g||0,kg:kgOf(o.price||0,o.g||0)}))}));
  const pr=L.filter(z=>z.price>0),np=L.filter(z=>!(z.price>0));return {list:[...rank(pr),...np],priced:pr.length}}

  return `<label class="opr ${cheap?'cheap':''}"><input type="radio" name="${name}" value="${z.p.id}|${z.sid}|${z.i}" ${j===0?'checked':''}>
    <span class="t">${multi?`<b>${esc(z.p.name)}</b><br>`:''}<span class="stg" style="background:${scol(sbyid(z.sid))};color:#fff">${esc(sname(z.sid))}</span> ${z.o.b?'<b>'+esc(z.o.b)+'</b> · ':''}<span class="${cheap?'best':''}">${z.price>0?priceTxt(z.o):'sin precio'}</span>${cheap&&L.priced>1?' <span class="best">· el más barato</span>':''}</span>${bd||'<span class="sub">sin nota</span>'}</label>`}).join('')}

      $('tgp').onclick=()=>tgSend(['✅ Prueba desde la app de la compra'],$('tgm'))};
  }else if(SEC==='notes'){
    html=back('🔄 Notas de productos')+`<div id="nrbox"></div>`;
    wire=()=>{NR=null;nrRender()};
  }
  $('sheet').innerHTML=html+`<div class="acts"><span></span><button class="btn g" id="cx">Cerrar</button></div>`;
  $('modal').classList.add('show');$('cx').onclick=()=>{close();render()};
  if(SEC)$('sbk').onclick=()=>stores('');
  wire();
}
function close(){$('modal').classList.remove('show');$('sheet').classList.remove('fresh')}
$('modal').onclick=e=>{if(e.target.id==='modal')close()};
// Deslizar el dedo para cambiar de pestaña: izquierda = siguiente, derecha = anterior
(()=>{let t0=null;const ORD=['list','dp','sm','pr','cmp','rc','pl'];
  document.addEventListener('touchstart',e=>{
    if(e.touches.length!==1||document.querySelector('.modal.show,#lb.show,#scan.show,#login.show')||e.target.closest('input,textarea,select,.tabs,details')){t0=null;return}
    const t=e.touches[0];if(t.clientX<24||t.clientX>window.innerWidth-24){t0=null;return}
    t0={x:t.clientX,y:t.clientY,t:Date.now()}},{passive:true});
  document.addEventListener('touchend',e=>{
    if(!t0)return;const t=e.changedTouches[0],dx=t.clientX-t0.x,dy=t.clientY-t0.y,dt=Date.now()-t0.t;t0=null;
    if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.6||dt>700)return;
    const inStore=S.stores.some(s=>s.id===cur),i=ORD.indexOf(cur);if(!inStore&&i<0)return;
    const next=dx<0?(inStore?'pr':ORD[Math.min(i+1,ORD.length-1)]):(inStore?'sm':ORD[Math.max(i-1,0)]);
    if(next===cur)return;cur=next;render();window.scrollTo(0,0)},{passive:true});
})();
render();startAuth();
</script></body></html>
