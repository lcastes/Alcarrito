<script type="module">

const firebaseConfig={apiKey:"AIzaSyCp-YWTUCidjRFLm27EIayge58YRvvZE_E",authDomain:"alcarrito-f7612.firebaseapp.com",projectId:"alcarrito-f7612",appId:"1:634133144954:web:0cfede80298b6f91c322c3"};

const DEF=[{id:'s1',name:'LIDL'},{id:'s2',name:'BM'}];

let S={stores:DEF,cats:DEFC,products:[],extras:[]},cur='list',edit=null,unsubs=[],lastErr='',Q='',FC='';

let app,auth,db;

  db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});}

function inferKind(name){const n=norm(name);if(/\bquesos?\b/.test(n))return 'cheese';if(/bebida|zumo|refresco|infusion|cerveza|\bvinos?\b|\baguas?\b/.test(n))return 'bev';if(/fresc|natural|basico|materia prima/.test(n))return 'fresh';return 'normal'}
const catKind=p=>{const c=S.cats.find(x=>x.id===(p&&p.cat));return c?(c.kind||inferKind(c.name)):'normal'};

function startAuth(){

  $('lbtn').onclick=async()=>{const p=new GoogleAuthProvider();
    try{await signInWithPopup(auth,p)}catch(e){
      if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request'){

function scanCode(){return new Promise(async resolve=>{
  const ov=$('scan'),v=$('scv');ov.classList.add('show');let stream=null,done=false,reader=null,timer=null;
  const finish=c=>{if(done)return;done=true;clearInterval(timer);try{reader&&reader.reset()}catch(e){}
    if(stream)stream.getTracks().forEach(t=>t.stop());v.srcObject=null;ov.classList.remove('show');resolve(c)};
  $('scx').onclick=()=>finish(null);
  try{
    if('BarcodeDetector' in window){
      let ok=true;try{const f=await BarcodeDetector.getSupportedFormats();ok=f.some(x=>/ean|upc/.test(x))}catch(e){}
      if(ok){const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
        stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
        v.srcObject=stream;await v.play();
        timer=setInterval(async()=>{try{const r=await det.detect(v);if(r.length)finish(r[0].rawValue)}catch(e){}},300);return}}
    await loadZX();
    const h=new Map();h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E]);
    reader=new ZXing.BrowserMultiFormatReader(h);
    await reader.decodeFromConstraints({video:{facingMode:{ideal:'environment'}}},v,res=>{if(res)finish(res.getText())});
  }catch(e){finish(null);alert('No se pudo abrir la cámara o cargar el lector. Revisa el permiso de cámara del navegador o escribe el código a mano.')}
})}

  shAll('[data-ao]').forEach(b=>b.onclick=()=>{syncForm();const e=edit.e[b.dataset.ao];
    if(!e.o.length)e.o.push({b:'',price:0,g:0});e.o.push({b:'',price:0,g:0});drawForm()});
  shAll('[data-rm]').forEach(b=>b.onclick=()=>{syncForm();const [sid,i]=b.dataset.rm.split(':');
    if(edit.e[sid])edit.e[sid].o.splice(+i,1);drawForm()});
  const sug=()=>{
    if(!edit.isNew){$('sug').innerHTML='';return}
    const t=norm($('name').value.trim());if(t.length<2){$('sug').innerHTML='';return}
    const w=t.split(/\s+/).filter(x=>x.length>1);
    const m=S.products.filter(p=>{const n=norm(p.name);return n&&(t.includes(n)||w.every(x=>n.includes(x)))}).slice(0,3);
    $('sug').innerHTML=m.length?'<div class="sub" style="flex:1 1 100%">¿Es el mismo producto? Toca para añadirlo ahí:</div>'+m.map(p=>`<button class="btn g" data-sg="${p.id}">${esc(p.name)} <span class="sub">(${S.stores.filter(x=>p.e[x.id]).map(x=>esc(x.name)).join(', ')})</span></button>`).join(''):''};
  $('name').oninput=sug;sug();
  $('sug').onclick=ev=>{const b=ev.target.closest('[data-sg]');if(b)mergeInto(b.dataset.sg)};
  $('cx').onclick=close;
  if(id)$('del').onclick=()=>{if(confirm('¿Eliminar este producto?')){delP(edit.id);close()}};
  $('ok').onclick=()=>{
    syncForm();const n=edit.name.trim();if(!n){$('name').focus();return}
    const e={};Object.entries(edit.e).forEach(([k,v])=>{e[k]={done:!!v.done,need:!!v.need,o:v.o.filter(x=>x.b||x.price>0||x.g>0||x.bc||x.ph||x.need||x.mn)}});
    if(!Object.keys(e).length){alert('Añade al menos una tienda donde se venda');return}
    putP({id:edit.id,name:n,photo:edit.photo,cat:edit.cat,e});close()};
  $('sheet').scrollTop=top;
}
let SEC='';
function stores(sec){
  if(sec!==undefined)SEC=sec;
  const back=t=>`<div class="sbar"><button class="btn g" id="sbk">‹ Ajustes</button><b>${t}</b></div>`;
  const email=(typeof auth!=='undefined'&&auth&&auth.currentUser&&auth.currentUser.email)||'';
  let html='',wire=()=>{};
  if(!SEC){
    const tile=(k,ic,t,sub)=>`<button class="stile" data-set="${k}"><span class="sico">${ic}</span><b class="sn">${t}</b><span class="sub">${sub}</span></button>`;
    html=`<h2>⚙️ Ajustes</h2><div class="sett">${tile('stores','🏪','Supermercados',S.stores.length+' tienda'+(S.stores.length===1?'':'s'))}${tile('cats','🏷️','Categorías',S.cats.length+' de productos')}${tile('rcats','🍳','Categorías de recetas',S.rcats.length+' categorías')}${tile('tg','✈️','Telegram',TG.token?'Configurado':'Sin configurar')}${tile('notes','🔄','Notas de productos','Actualizar todas')}${tile('out','🚪','Cerrar sesión',esc(email))}</div>`;
    wire=()=>document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{const k=b.dataset.set;if(k==='out'){if(confirm('¿Cerrar sesión?')){close();signOut(auth)}return}stores(k)});
  }else if(SEC==='stores'){
    html=back('🏪 Supermercados')+S.stores.map(s=>`<div class="sedit"><div class="srow"><input type="text" value="${esc(s.name)}" data-sn="${s.id}"><input type="color" value="${scol(s)}" data-sc="${s.id}"><button class="btn r" data-d="${s.id}">Quitar</button></div><div class="srow"><label class="btn g" style="flex:none">🖼️ ${s.logo?'Cambiar logo':'Añadir logo'}<input type="file" accept="image/*" hidden data-sl="${s.id}"></label>${s.logo?`<img class="slogo" src="${s.logo}" alt=""><button class="btn g" data-rl="${s.id}">Quitar logo</button>`:''}</div></div>`).join('')
      +`<label class="f">Añadir supermercado</label><div class="srow"><input type="text" id="ns" placeholder="Mercadona, Eroski…"><button class="btn" id="add">Añadir</button></div>`;
    wire=()=>{
      document.querySelectorAll('[data-sn]').forEach(i=>i.onchange=()=>{const n=i.value.trim();if(!n){i.value=sname(i.dataset.sn);return}putStores(S.stores.map(s=>s.id===i.dataset.sn?{...s,name:n}:s));render()});
      document.querySelectorAll('[data-sc]').forEach(i=>i.onchange=()=>{putStores(S.stores.map(s=>s.id===i.dataset.sc?{...s,color:i.value}:s));render()});
      document.querySelectorAll('[data-sl]').forEach(i=>i.onchange=ev=>{const f=ev.target.files[0];if(!f)return;shrinkLogo(f,u=>{putStores(S.stores.map(s=>s.id===i.dataset.sl?{...s,logo:u}:s));stores();render()})});
      document.querySelectorAll('[data-rl]').forEach(b=>b.onclick=()=>{putStores(S.stores.map(s=>s.id===b.dataset.rl?{...s,logo:''}:s));stores();render()});
      $('add').onclick=()=>{const n=$('ns').value.trim();if(n){putStores([...S.stores,{id:'s'+Date.now(),name:n}]);stores()}};
      document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(S.stores.length<2)return;if(!confirm('¿Quitar esta tienda y sus precios?'))return;
        const id=b.dataset.d;putStores(S.stores.filter(x=>x.id!==id));
        S.products.forEach(p=>{if(!p.e[id])return;const q=JSON.parse(JSON.stringify(p));delete q.e[id];Object.keys(q.e).length?putP(q):delP(p.id)});stores()})};
  }else if(SEC==='cats'){
    html=back('🏷️ Categorías de productos')+(S.cats.map(c=>`<div class="srow"><span>${esc(c.name)}</span><select data-ck="${c.id}" style="max-width:160px;flex:none">${Object.entries(KINDS).map(([k,l])=>`<option value="${k}" ${(c.kind||'')===k?'selected':''}>${k===''?'Auto ('+KINDS[inferKind(c.name)]+')':l}</option>`).join('')}</select><button class="btn r" data-dc="${c.id}">Quitar</button></div>`).join('')||'<div class="sub">No hay categorías.</div>')
      +`<div class="sub" style="margin-top:8px">Tipo de análisis: <b>Queso</b> analiza los productos de esa categoría como queso; <b>Bebida</b> usa la escala de bebidas; <b>Fresco</b> es para materia prima (sin código de barras ni nota) y se puede filtrar aparte. «Auto» lo deduce del nombre.</div><label class="f">Añadir categoría</label><div class="srow"><input type="text" id="nc" placeholder="Congelados, bebidas…"><button class="btn" id="addc">Añadir</button></div>`;
    wire=()=>{
      document.querySelectorAll('[data-ck]').forEach(sl=>sl.onchange=()=>{putCats(S.cats.map(c=>c.id===sl.dataset.ck?{...c,kind:sl.value}:c));stores()});
      $('addc').onclick=()=>{const n=$('nc').value.trim();if(n){putCats([...S.cats,{id:'c'+Date.now(),name:n}]);stores()}};
      document.querySelectorAll('[data-dc]').forEach(b=>b.onclick=()=>{if(!confirm('¿Quitar esta categoría? Sus productos pasarán a «Sin categoría».'))return;
        const id=b.dataset.dc;putCats(S.cats.filter(c=>c.id!==id));
        S.products.forEach(p=>{if(p.cat===id)putP({...p,cat:''})});
        S.extras.forEach(x=>{if(x.cat===id)putX({...x,cat:''})});stores()})};
  }else if(SEC==='rcats'){
    html=back('🍳 Categorías de recetas')+`<div class="chips" style="margin-top:6px;flex-wrap:wrap">${S.rcats.map(c=>`<span class="chip">${esc(c)} <button class="x" data-rcd="${esc(c)}" type="button">✕</button></span>`).join('')||'<span class="sub">No hay categorías.</span>'}</div>
      <label class="f">Añadir categoría</label><div class="srow"><input type="text" id="rcn" placeholder="Postres, Vegano, Aperitivos…"><button class="btn" id="rcb">Añadir</button></div>`;
    wire=()=>{
      document.querySelectorAll('[data-rcd]').forEach(b=>b.onclick=()=>{putRcats(S.rcats.filter(c=>c!==b.dataset.rcd));stores()});
      $('rcb').onclick=()=>{const n=$('rcn').value.trim();if(n&&!S.rcats.includes(n)){putRcats([...S.rcats,n]);stores()}}};
  }else if(SEC==='tg'){
    html=back('✈️ Telegram')+`<div class="sub">Para enviar la lista al grupo. El código del bot se guarda en Firebase (solo lo leen vuestras cuentas), no en la página.</div>
      <label class="f">Código del bot (token)</label><input type="password" id="tgt" autocomplete="off" placeholder="${TG.token?'Ya guardado (escribe otro para cambiarlo)':'123456789:AA…'}">
      <label class="f">ID del grupo</label><input type="text" id="tgc" value="${esc(TG.chat||'')}" placeholder="-100…">
      <div class="srow" style="margin-top:8px"><button class="btn" id="tgs">Guardar</button><button class="btn g" id="tgp">Enviar prueba</button></div><div class="sub" id="tgm" style="margin-top:6px"></div>`;
    wire=()=>{
      $('tgs').onclick=()=>{const t=$('tgt').value.trim()||TG.token||'',c=$('tgc').value.trim();
        if(!/^\d+:[\w-]{30,}$/.test(t)){$('tgm').textContent='El código del bot no tiene el formato esperado (123456789:AA…).';return}
        if(!/^-?\d+$/.test(c)){$('tgm').textContent='El ID del grupo debe ser un número, como -100123456789.';return}
        TG={token:t,chat:c};setDoc(doc(db,'config','telegram'),TG).catch(wfail);$('tgt').value='';$('tgm').textContent='Guardado.'};
      $('tgp').onclick=()=>tgSend(['✅ Prueba desde la app de la compra'],$('tgm'))};
  }else if(SEC==='notes'){
    html=back('🔄 Notas de productos')+`<div class="sub">Vuelve a consultar Open Food Facts de todas las marcas que tengan código de barras y recalcula sus notas. Las que tengan datos escritos a mano no se tocan.</div><div style="margin-top:14px"><button class="btn" id="rfa">🔄 Actualizar todas las notas</button></div>`;
    wire=()=>{$('rfa').onclick=()=>refreshAll($('rfa'))};
  }
  $('sheet').innerHTML=html+`<div class="acts"><span></span><button class="btn g" id="cx">Cerrar</button></div>`;
  $('modal').classList.add('show');$('cx').onclick=()=>{close();render()};
  if(SEC)$('sbk').onclick=()=>stores('');
  wire();
}
function close(){$('modal').classList.remove('show');$('sheet').classList.remove('fresh')}
$('modal').onclick=e=>{if(e.target.id==='modal')close()};
// Deslizar el dedo para cambiar de pestaña: izquierda = siguiente, derecha = anterior
(()=>{let t0=null;const ORD=['list','sm','pr','cmp','rc','pl'];
  document.addEventListener('touchstart',e=>{
    if(e.touches.length!==1||document.querySelector('.modal.show,#lb.show,#scan.show,#login.show')||e.target.closest('input,textarea,select,.tabs,details')){t0=null;return}
    const t=e.touches[0];if(t.clientX<24||t.clientX>window.innerWidth-24){t0=null;return}
    t0={x:t.clientX,y:t.clientY,t:Date.now()}},{passive:true});
  document.addEventListener('touchend',e=>{
    if(!t0)return;const t=e.changedTouches[0],dx=t.clientX-t0.x,dy=t.clientY-t0.y,dt=Date.now()-t0.t;t0=null;
    if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.6||dt>700)return;
    const inStore=S.stores.some(s=>s.id===cur),i=ORD.indexOf(cur);if(!inStore&&i<0)return;
    const next=dx<0?(inStore?'pr':ORD[Math.min(i+1,ORD.length-1)]):(inStore?'sm':ORD[Math.max(i-1,0)]);
    if(next===cur)return;cur=next;render();window.scrollTo(0,0)},{passive:true});
})();
render();startAuth();
</script></body></html>
